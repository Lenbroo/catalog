<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Catalogue, Phase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Klea brand palette */
  --purple:#A190F9; --dpurple:#554A93; --grey:#EEF1F4;
  --green:#B6DEA7; --yellow:#F5E3A3; --blue:#5A7DD6; --pink:#E0A1D7; --brown:#61433A;

  --bg:var(--grey); --surface:#FFFFFF; --ink:#2B2550; --ink-2:#5E5886; --ink-3:#8A86A6;
  --line:#E1E4EE; --line-2:#F4F5F9; --accent:var(--dpurple); --on-accent:#FFFFFF;
  --hl:#F5E3A3; --focus:#5A7DD6; --shadow:0 1px 2px rgba(85,74,147,.06),0 8px 24px -12px rgba(85,74,147,.25);
  --mix:#FFFFFF; --tint-amt:38%;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16132A; --surface:#211D3B; --ink:#EEF1F4; --ink-2:#C3BEE3; --ink-3:#8F89B8;
    --line:#332D57; --line-2:#29244A; --accent:#A190F9; --on-accent:#16132A;
    --hl:#7A6A2A; --focus:#A190F9; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --mix:#211D3B; --tint-amt:30%;
  }
}
:root[data-theme="dark"]{
  --bg:#16132A; --surface:#211D3B; --ink:#EEF1F4; --ink-2:#C3BEE3; --ink-3:#8F89B8;
  --line:#332D57; --line-2:#29244A; --accent:#A190F9; --on-accent:#16132A;
  --hl:#7A6A2A; --focus:#A190F9; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --mix:#211D3B; --tint-amt:30%;
}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:18px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.logo{display:block;height:44px;width:auto;transition:transform .5s var(--ease)}
.brand:hover .logo{transform:scale(1.03)}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.brand-sep{width:1.5px;height:34px;background:var(--line);border-radius:1px;flex:none}
.brand-t{font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em;line-height:1.1;text-align:left}
.brand-t span{display:block;font-weight:500;font-size:13px;color:var(--ink-3);letter-spacing:0}
.search{position:relative;flex:1 1 320px;max-width:440px}
.search input{width:100%;height:46px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0 42px 0 44px;font-size:15px;transition:border-color .2s,box-shadow .25s}
.search input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px color-mix(in srgb,var(--purple) 22%,transparent)}
.search svg{position:absolute;left:15px;top:14px;width:18px;height:18px;color:var(--ink-3)}
.search .clr{position:absolute;right:7px;top:7px;width:32px;height:32px;border:0;background:var(--line-2);border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:18px;line-height:1;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .2s,transform .2s var(--ease)}
.search.has .clr{opacity:1;pointer-events:auto;transform:none}
.tabs{position:relative;display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2);transition:color .3s}
.tabs button[aria-selected="true"]{color:var(--on-accent)}
.tabs .pill{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--accent);transition:transform .45s var(--ease),width .45s var(--ease)}

/* ---------- stage ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:10px 24px 90px}
.stage-head{display:flex;align-items:center;gap:16px;margin:18px 0 22px;min-height:52px}
.back{flex:none;padding:0;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .35s var(--ease),background .2s,border-color .2s,opacity .3s,width .35s var(--ease),margin .35s var(--ease)}
.back:hover{border-color:var(--purple);transform:translateX(-3px)}
.back svg{width:20px;height:20px}
.back.gone{opacity:0;width:0;margin-right:-16px;border-width:0;pointer-events:none;overflow:hidden}
.stage-title{min-width:0;flex:1}
.stage-title h1{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.025em;line-height:1.08}
.stage-title p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;margin:6px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-3)}
.crumbs a{color:var(--ink-2);text-decoration:none;font-weight:600;border-radius:6px}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--ink-3)}
.steps{display:flex;gap:6px;flex:none;align-self:center}
.steps i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .5s var(--ease),background .4s}
.steps i.on{background:var(--purple)}
.steps i.cur{width:26px;background:var(--dpurple)}
:root:not([data-theme="light"]) .steps i.cur{background:var(--accent)}

#stage{position:relative}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

/* ---------- tiles ---------- */
.tile{--tone:var(--purple);all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:170px;padding:24px 26px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--tone) 60%,var(--line));box-shadow:0 2px 4px rgba(85,74,147,.06),0 22px 40px -18px color-mix(in srgb,var(--tone) 70%,transparent)}
.tile:active{transform:translateY(-1px) scale(.985)}
.tile:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
.tile .blob{position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--tone);opacity:.28;transition:transform .7s var(--ease),opacity .5s}
.tile:hover .blob{transform:scale(1.25) translate(-10px,10px);opacity:.4}
.tile.big{min-height:230px;background:color-mix(in srgb,var(--tone) var(--tint-amt),var(--mix));border-color:transparent}
.tile.big .blob{opacity:.55;width:240px;height:240px;right:-70px;top:-80px}
.tile.big:hover .blob{opacity:.75}
.t-num{position:relative;font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.t-num small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink-2);margin-left:6px}
.t-body{position:relative;margin-top:auto;padding-top:26px;padding-right:44px}
.t-name{display:block;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.tile:not(.big) .t-name{font-size:19px}
.t-desc{display:block;margin-top:6px;font-size:14px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-go{position:absolute;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:transform .45s var(--ease),background .3s,color .3s;box-shadow:0 2px 8px -2px rgba(85,74,147,.25)}
.tile:not(.big) .t-go{background:var(--line-2);box-shadow:none}
.tile:hover .t-go{transform:translateX(4px);background:var(--dpurple);color:#fff}
.t-go svg{width:18px;height:18px}
.t-meta{position:relative;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill-s{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--tone) 30%,var(--mix));color:var(--ink)}
.t-match{position:relative;display:block;margin-top:10px;font-size:13.5px;color:var(--ink-2)}

/* ---------- motion: step transitions ---------- */
.anim-in{animation:tileIn .6s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.dir-back .anim-in{animation-name:tileInBack}
@keyframes tileIn{from{opacity:0;transform:translate(34px,18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tileInBack{from{opacity:0;transform:translate(-34px,18px) scale(.97)}to{opacity:1;transform:none}}
#stage.leaving .anim-out{animation:tileOut .32s var(--ease) both;animation-delay:calc(min(var(--i,0),8) * 22ms)}
#stage.leaving.dir-back .anim-out{animation-name:tileOutBack}
#stage.leaving .chosen{animation:chosen .42s var(--ease) both!important;z-index:2}
@keyframes tileOut{to{opacity:0;transform:translate(-26px,8px) scale(.96)}}
@keyframes tileOutBack{to{opacity:0;transform:translate(26px,8px) scale(.96)}}
@keyframes chosen{0%{transform:scale(1)}35%{transform:scale(1.03);box-shadow:0 30px 60px -24px color-mix(in srgb,var(--tone) 90%,transparent)}100%{opacity:0;transform:scale(1.08)}}
.head-anim{animation:headIn .55s var(--ease) both}
@keyframes headIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage-head.leaving .stage-title{animation:headOut .28s var(--ease) both}
@keyframes headOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- detail ---------- */
.hero{--tone:var(--purple);position:relative;overflow:hidden;border-radius:26px;padding:30px 30px 26px;background:color-mix(in srgb,var(--tone) var(--tint-amt),var(--mix))}
.hero .blob{position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:var(--tone);opacity:.55;animation:float 9s ease-in-out infinite}
.hero .blob.b2{right:auto;left:-120px;top:auto;bottom:-170px;width:280px;height:280px;opacity:.25;animation-delay:-4s}
@keyframes float{50%{transform:translate(-18px,14px) scale(1.06)}}
.stats{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.stat{background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(6px);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stat span{display:block;margin-top:4px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.hero-panels{position:relative;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.hero-panels .pill-s{background:var(--surface)}
.sec{margin-top:34px}
.sec>h2{margin:0 0 14px;font-size:22px;font-weight:800;letter-spacing:-.015em}
.comp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.comp{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px}
.comp h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.comp h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--tone,var(--purple))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--line-2);border-radius:9px;padding:5px 11px;font-size:14px;font-weight:500}
.panel{--tone:var(--purple);background:var(--surface);border:1.5px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;transition:border-color .3s,box-shadow .4s var(--ease)}
.panel.open{box-shadow:var(--shadow)}
.panel-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px}
.panel-h:focus-visible{outline:2.5px solid var(--focus);outline-offset:-3px;border-radius:20px}
.panel-h .sw{width:14px;height:38px;border-radius:7px;background:var(--tone);flex:none}
.panel-h .nm{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.panel-h .nm small{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:2px}
.panel-h .ct{font-size:28px;font-weight:800;letter-spacing:-.03em}
.panel-h .chev{width:34px;height:34px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;transition:transform .45s var(--ease),background .3s;flex:none}
.panel.open .panel-h .chev{transform:rotate(180deg);background:var(--purple);color:#fff}
.panel-h .chev svg{width:16px;height:16px}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.panel.open .reveal{grid-template-rows:1fr}
.reveal>div{overflow:hidden;min-height:0}
.p-body{padding:4px 20px 22px}
.grp{margin-top:18px}
.grp h4{margin:0 0 6px;font-size:15.5px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.grp h4 span{font-weight:600;color:var(--ink-3);font-size:13.5px}
ul.tests{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
ul.tests li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.panel.open ul.tests li{animation:rowIn .45s var(--ease) both;animation-delay:calc(min(var(--r,0),24) * 14ms + 120ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
ul.tests li.hit{background:color-mix(in srgb,var(--yellow) 55%,transparent);border-radius:8px;padding-left:8px;padding-right:8px}
.fl{display:flex;gap:4px;flex:none}
.f{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;line-height:16px}
.f.calc{background:color-mix(in srgb,var(--blue) 18%,var(--mix));color:var(--blue)}
.note{margin-top:14px;padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--yellow) 45%,var(--mix));font-size:14.5px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--ink-2);margin-top:18px}
.legend span{display:flex;gap:6px;align-items:center}
.used{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.linkchip{all:unset;cursor:pointer;background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;transition:background .25s,color .25s,transform .3s var(--ease)}
.linkchip:hover{background:var(--dpurple);color:#fff;transform:translateY(-2px)}
.linkchip:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.hlbar{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 12px 10px 16px;border-radius:14px;background:color-mix(in srgb,var(--yellow) 60%,var(--mix));font-size:14.5px}
.hlbar button{margin-left:auto;border:0;background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}

/* ---------- search / markers ---------- */
.res-sec+.res-sec{margin-top:34px}
.res-sec>h2{margin:0 0 14px;font-size:20px;font-weight:800}
.tablewrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:13.5px;color:var(--ink-2);font-weight:700;background:var(--line-2)}
td.nm{font-weight:700;min-width:190px}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--line-2)}
td .chips .chip{font-size:13px;padding:3px 9px}
.empty{padding:50px 20px;text-align:center;color:var(--ink-2);font-size:16px}
.empty b{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}

@media (max-width:760px){
  .grid,.comp-grid{grid-template-columns:1fr;gap:12px}
  .tile{min-height:140px;padding:20px}
  .tile.big{min-height:170px}
  .t-num{font-size:36px}
  .top-in{padding:12px 16px;gap:10px}
  .search{max-width:none;order:3;flex-basis:100%}
  .tabs{flex:1;order:2}.tabs button{flex:1;padding:8px 6px;font-size:13.5px}
  .brand{order:1;margin-right:0;width:100%;gap:12px}
  .logo{height:36px}
  .brand-sep{height:28px}
  .top{position:static}
  .wrap{padding:6px 16px 60px}
  .steps{display:none}
  .hero{padding:22px 18px}
  ul.tests{grid-template-columns:1fr}
  .panel-h{padding:16px}
  .p-body{padding:4px 16px 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="top" id="top">

const catBySlug={};cats.forEach(c=>catBySlug[slug(c)]=c);
const tone=c=>TONES[cats.indexOf(c)%TONES.length];
const subsOf=c=>{const a=[];S.filter(s=>s.category===c).forEach(s=>{if(s.sub&&!a.includes(s.sub))a.push(s.sub)});return a};
const panelUse={};S.forEach(s=>s.pan.forEach(p=>(panelUse[p]=panelUse[p]||[]).push(s)));
const markerPanels={};Object.entries(P).forEach(([p,v])=>(v.tests||[]).forEach(sn=>(markerPanels[sn]=markerPanels[sn]||[]).push(p)));
const panelTone=p=>{const u=panelUse[p];return u&&u.length?tone(u[0].category):"var(--grey)"};
const uniqueCount=s=>{const set=new Set();let extra=0;s.pan.forEach(p=>{const v=P[p];if(!v)return;if(v.tests)v.tests.forEach(t=>set.add(t));else extra+=v.count||0});return set.size+extra};

/* ---------- search helpers ---------- */
let Q="",HL="";
const termsOf=q=>q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const matches=(hay,q)=>{const t=termsOf(q);const h=norm(hay);return t.length&&t.every(w=>new RegExp("(^|[^a-z0-9])"+reEsc(w)).test(h))};
function hl(text,q){
  let out=esc(text);q=q??HL;const t=termsOf(q);if(!t.length)return out;
  const phrase=q.trim().replace(/\s+/g," ");
  const list=norm(text).includes(phrase.toLowerCase())?[phrase]:t.filter(w=>w.length>1);
  list.forEach(w=>{const re=new RegExp("("+reEsc(esc(w))+")","ig");out=out.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,"<mark>$1</mark>"))});
  return out;
}
const testHay=sn=>T[sn]?T[sn].name+" "+T[sn].group:"";

/* ---------- routing ---------- */
function parse(h){
  const p=(h||"#/").replace(/^#\/?/,"").split("/").filter(Boolean);
  if(p[0]==="panels")return {view:"panels",depth:0};
  if(p[0]==="panel")return {view:"panels",panel:decodeURIComponent(p[1]||""),depth:1};
  if(p[0]==="markers")return {view:"markers",depth:0};
  if(p[0]==="svc"){const s=S[+p[1]];if(s)return {view:"services",svc:s,depth:s.sub?3:2}}
  if(p[0]==="c"&&catBySlug[p[1]]){const c=catBySlug[p[1]];
    if(p[2]==="s"){const sub=subsOf(c).find(x=>slug(x)===p[3]);if(sub)return {view:"services",cat:c,sub,depth:2}}
    return {view:"services",cat:c,depth:1}}
  return {view:"services",depth:0};
}
const hrefCat=c=>`#/c/${slug(c)}`, hrefSub=(c,sb)=>`#/c/${slug(c)}/s/${slug(sb)}`, hrefSvc=s=>`#/svc/${s.i}`, hrefPanel=p=>`#/panel/${encodeURIComponent(p)}`;
function parentOf(r){
  if(r.view==="panels"&&r.panel)return "#/panels";
  if(r.svc)return r.svc.sub?hrefSub(r.svc.category,r.svc.sub):hrefCat(r.svc.category);
  if(r.sub)return hrefCat(r.cat);
  if(r.cat)return "#/";
  return null;
}

/* ---------- views ---------- */
function tileHTML(o,i){
  return `<button class="tile ${o.big?"big":""} anim-in anim-out" style="--tone:${o.tone};--i:${i}" data-go="${o.href}" aria-label="${esc(o.aria||o.name)}">
    <span class="blob" aria-hidden="true"></span>
    ${o.num!=null?`<span class="t-num" data-count="${o.num}">${o.num}<small>${esc(o.num===1&&o.unit==="markers"?"marker":(o.unit||""))}</small></span>`:""}
    <span class="t-body"><span class="t-name">${o.nameHTML||esc(o.name)}</span>${o.desc?`<span class="t-desc">${o.desc}</span>`:""}${o.meta||""}${o.match||""}</span>
    <span class="t-go" aria-hidden="true">${ARROW}</span>
  </button>`;
}
function viewCategories(){
  return {title:"Service catalogue",sub:`${plural(cats.length,"category","categories")} and ${S.length} services. Pick a category to begin.`,
    html:`<div class="grid">${cats.map((c,i)=>{const n=S.filter(s=>s.category===c).length;const subs=subsOf(c);
      return tileHTML({big:1,tone:tone(c),href:hrefCat(c),name:c,num:n,unit:n===1?"service":"services",
        desc:esc([...subs,...S.filter(s=>s.category===c&&!s.sub).map(s=>s.name)].join(", "))},i)}).join("")}</div>`};
}
function serviceTile(s,i,extra){
  const comps=s.comps.filter(c=>c.group!=="Doctor & Vital Signs").length;
  const meta=`<span class="t-meta">${s.doctor?`<span class="pill-s">Doctor ${esc(s.doctor)}</span>`:""}${comps?`<span class="pill-s">${plural(comps,"component")}</span>`:""}${s.pan.length>1?`<span class="pill-s">${s.pan.length} panels</span>`:""}</span>`;
  return tileHTML({tone:tone(s.category),href:hrefSvc(s),name:s.name,nameHTML:extra?.q?hl(s.name,extra.q):null,num:s.count??null,unit:s.count!=null?"markers":"",
    desc:s.pan.length?esc(s.pan.join(", ")):"No blood panel",meta,match:extra?.match||""},i);
}
function viewCategory(c){
  const subs=subsOf(c);const direct=S.filter(s=>s.category===c&&!s.sub);
  let i=0;const tiles=subs.map(sb=>{const list=S.filter(s=>s.category===c&&s.sub===sb);
    return tileHTML({big:1,tone:tone(c),href:hrefSub(c,sb),name:sb,num:list.length,unit:list.length===1?"service":"services",desc:esc(list.map(s=>s.name).join(", "))},i++)}).join("")
    +direct.map(s=>serviceTile(s,i++)).join("");
  const n=S.filter(s=>s.category===c).length;
  return {title:c,crumbs:[["All categories","#/"]],sub:subs.length?`${plural(subs.length,"sub-category","sub-categories")}${direct.length?` and ${plural(direct.length,"service")}`:""}`:`${plural(n,"service")}`,html:`<div class="grid">${tiles}</div>`};
}
function viewSub(c,sb){
  const list=S.filter(s=>s.category===c&&s.sub===sb);
  return {title:sb,crumbs:[["All categories","#/"],[c,hrefCat(c)]],sub:plural(list.length,"service"),html:`<div class="grid">${list.map((s,i)=>serviceTile(s,i)).join("")}</div>`};
}
function testsHTML(v,hits){
  const groups={};v.tests.forEach(sn=>{const t=T[sn];(groups[t.group||"Other"]=groups[t.group||"Other"]||[]).push(sn)});
  let r=0;
  return Object.keys(groups).sort().map(g=>{const list=groups[g].sort((a,b)=>T[a].name.localeCompare(T[b].name));
    return `<div class="grp"><h4>${hl(g)}<span>${list.length}</span></h4><ul class="tests">${list.map(sn=>{const t=T[sn];const f=[];
      if(t.method&&t.method.startsWith("Calc"))f.push(`<span class="f calc" title="Calculated from other results">calc</span>`);
      return `<li style="--r:${r++}" class="${hits.has(sn)?"hit":""}"><span>${hl(t.name)}</span><span class="fl">${f.join("")}</span></li>`}).join("")}</ul></div>`}).join("");
}
function panelCard(p,open,hits,i){
  const v=P[p];if(!v)return"";
  const body=v.tests?testsHTML(v,hits):`<p class="nolist">This panel covers ${v.count} allergens and markers. The individual list is not part of the Phase 2 blood panel sheet.</p>`;
  const nu=(panelUse[p]||[]).length;const where=nu?`Used in ${nu} service${nu===1?"":"s"}`:"Not linked to a service";
  return `<section class="panel anim-in ${open?"open":""}" style="--tone:${panelTone(p)};--i:${i}">
    <button class="panel-h" aria-expanded="${open}"><span class="sw" aria-hidden="true"></span><span class="nm">${hl(p)}<small>${where}</small></span><span class="ct">${v.count}</span><span class="chev" aria-hidden="true">${CHEV}</span></button>
    <div class="reveal"><div><div class="p-body">${body}</div></div></div></section>`;
}
const LEGEND=`<div class="legend"><span><span class="f calc">calc</span> calculated from other results</span></div>`;
function hlBar(){return HL?`<div class="hlbar anim-in" style="--i:0">Highlighting “${esc(HL)}”<button id="hloff">Clear highlight</button></div>`:""}
function viewService(s){
  const hits=new Set();if(HL)s.pan.forEach(p=>(P[p]?.tests||[]).forEach(sn=>{if(matches(testHay(sn),HL))hits.add(sn)}));
  const vit=s.comps.some(c=>c.name==="Vital Signs Assessment");
  const other=s.comps.filter(c=>c.group!=="Doctor & Vital Signs");
  const byG={};other.forEach(c=>(byG[c.group]=byG[c.group]||[]).push(c.name));
  const consult=[];if(s.doctor)consult.push(`Doctor consultation, ${esc(s.doctor)}`);if(vit)consult.push("Vital signs assessment");
  const groups=[];if(consult.length)groups.push(["Consultation",consult]);Object.entries(byG).forEach(([g,l])=>groups.push([g,l.map(n=>hl(n))]));
  const uniq=s.pan.length>1?uniqueCount(s):null;
  const stats=[[s.count??"None","Blood markers"],[s.pan.length||"None",s.pan.length===1?"Blood panel":"Blood panels"],[consult.length+other.length||"None",consult.length+other.length===1?"Item included":"Items included"],[s.doctor||"None","Doctor time"]];
  let i=1;
  const crumbs=[["All categories","#/"],[s.category,hrefCat(s.category)]];if(s.sub)crumbs.push([s.sub,hrefSub(s.category,s.sub)]);
  const notes=[];
  if(!s.comps.length)notes.push("No components are marked for this service in the catalogue sheet yet.");
  if(uniq!==null&&uniq!==s.count)notes.push(`The catalogue total of ${s.count} adds up the panel counts. Some markers sit in more than one panel, so this service covers ${uniq} distinct markers.`);
  return {title:s.name,crumbs,html:`${hlBar()}
    <div class="hero anim-in" style="--tone:${tone(s.category)};--i:0"><span class="blob" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
      <div class="stats">${stats.map(([b,l])=>`<div class="stat"><b ${typeof b==="number"?`data-count="${b}"`:""}>${esc(b)}</b><span>${l}</span></div>`).join("")}</div>
    </div>
    <div class="sec anim-in" style="--i:${i++}"><h2>What’s included</h2>
      ${groups.length?`<div class="comp-grid">${groups.map(([g,l])=>`<div class="comp" style="--tone:${tone(s.category)}"><h3><span class="dot"></span>${esc(g)}</h3><div class="chips">${l.map(n=>`<span class="chip">${n}</span>`).join("")}</div></div>`).join("")}</div>`:`<p class="nolist">Nothing is listed for this service yet.</p>`}
    </div>
    ${s.pan.length?`<div class="sec anim-in" style="--i:${i++}"><h2>Blood panels</h2>${s.pan.map((p,k)=>panelCard(p,HL?[...hits].some(sn=>(P[p]?.tests||[]).includes(sn)):true,hits,k+i)).join("")}${LEGEND}</div>`:""}
    ${notes.map(n=>`<div class="note anim-in" style="--i:${i++}">${n}</div>`).join("")}`};
}
function viewPanels(){
  const names=Object.keys(P);
  return {title:"Blood panels",sub:`${names.length} panels. Open one to see every marker and where it is used.`,
    html:`<div class="grid">${names.map((p,i)=>{const u=panelUse[p]||[];
      return tileHTML({tone:panelTone(p),href:hrefPanel(p),name:p,num:P[p].count,unit:"markers",desc:u.length?`Used in ${esc(u.map(s=>s.name).join(", "))}`:"Not linked to a service in the new catalogue"},i)}).join("")}</div>`};
}
function viewPanel(p){
  const v=P[p];if(!v)return viewPanels();
  const u=panelUse[p]||[];
  const hits=new Set();if(HL&&v.tests)v.tests.forEach(sn=>{if(matches(testHay(sn),HL))hits.add(sn)});
  const groups=v.tests?new Set(v.tests.map(sn=>T[sn].group)).size:null;
  return {title:p,crumbs:[["All blood panels","#/panels"]],html:`${hlBar()}
    <div class="hero anim-in" style="--tone:${panelTone(p)};--i:0"><span class="blob" aria-hidden="true"></span><span class="blob b2" aria-hidden="true"></span>
      <div class="stats"><div class="stat"><b data-count="${v.count}">${v.count}</b><span>Markers</span></div>${groups?`<div class="stat"><b data-count="${groups}">${groups}</b><span>Profiles</span></div>`:""}<div class="stat"><b data-count="${u.length}">${u.length}</b><span>${u.length===1?"Service":"Services"}</span></div></div>
      ${u.length?`<div class="used">${u.map(s=>`<button class="linkchip" data-go="${hrefSvc(s)}">${esc(s.name)}</button>`).join("")}</div>`:""}
    </div>
    <div class="sec anim-in" style="--i:1"><h2>Markers in this panel</h2>
      ${v.tests?`<div class="panel open anim-in" style="--tone:${panelTone(p)};--i:2"><div class="p-body" style="padding-top:8px">${testsHTML(v,hits)}</div></div>${LEGEND}`:`<p class="nolist">This panel covers ${v.count} allergens and markers. The individual list is not part of the Phase 2 blood panel sheet.</p>`}
    </div>`};
}
function markerRows(filter){
  return Object.keys(T).map(Number).sort((a,b)=>T[a].name.localeCompare(T[b].name)).filter(filter).map((sn,i)=>{const t=T[sn];const pans=markerPanels[sn]||[];
    const svcs=new Set(pans.flatMap(p=>(panelUse[p]||[]).map(s=>s.i)));
    return `<tr class="anim-in" style="--i:${Math.min(i,20)}"><td class="nm">${hl(t.name,Q||HL)}</td><td>${esc(t.group)}</td><td>${esc(t.method)}${t.req?`<div style="color:var(--ink-3);font-size:13px;white-space:pre-line">From ${esc(t.req.replace(/ \(SN \d+\)/g,"").replace(/\n/g," and "))}</div>`:""}</td><td><div class="chips">${pans.length?pans.map(p=>`<span class="chip">${esc(p)}</span>`).join(""):`<span style="color:var(--ink-3)">Not in any panel</span>`}</div></td><td>${svcs.size}</td></tr>`}).join("");
}
const TABLE=rows=>`<div class="tablewrap anim-in" style="--i:0"><table><thead><tr><th>Marker</th><th>Profile</th><th>Method</th><th>Blood panels</th><th>Services</th></tr></thead><tbody>${rows}</tbody></table></div>`;
function viewMarkers(){return {title:"Markers",sub:`${Object.keys(T).length} markers across all blood panels`,html:TABLE(markerRows(()=>true))}}
function viewSearch(){
  const svc=[];S.forEach(s=>{
    const hits=[];s.pan.forEach(p=>(P[p]?.tests||[]).forEach(sn=>{if(matches(testHay(sn),Q)&&!hits.includes(sn))hits.push(sn)}));
    const base=matches([s.name,s.category,s.sub,s.doctor,...s.pan,...s.comps.map(c=>c.name+" "+c.group)].join(" "),Q);
    if(base||hits.length)svc.push({s,hits});
  });
  const pans=Object.keys(P).filter(p=>matches(p,Q)||(P[p].tests||[]).some(sn=>matches(testHay(sn),Q)));
  const mk=Object.keys(T).map(Number).filter(sn=>matches(testHay(sn),Q));
  let i=0;
  const sec=[];
  if(svc.length)sec.push(`<div class="res-sec"><h2>${plural(svc.length,"service")}</h2><div class="grid">${svc.map(({s,hits})=>serviceTile(s,i++,{q:Q,match:hits.length?`<span class="t-match">Includes ${hits.slice(0,3).map(sn=>hl(T[sn].name,Q)).join(", ")}${hits.length>3?` and ${hits.length-3} more`:""}</span>`:""})).join("")}</div></div>`);
  if(pans.length)sec.push(`<div class="res-sec"><h2>${plural(pans.length,"blood panel")}</h2><div class="grid">${pans.map(p=>tileHTML({tone:panelTone(p),href:hrefPanel(p),name:p,nameHTML:hl(p,Q),num:P[p].count,unit:"markers",desc:esc((panelUse[p]||[]).map(s=>s.name).join(", ")||"Not linked to a service")},i++)).join("")}</div></div>`);
  if(mk.length)sec.push(`<div class="res-sec"><h2>${plural(mk.length,"marker")}</h2>${TABLE(markerRows(sn=>mk.includes(sn)))}</div>`);
  return {title:`Results for “${Q.trim()}”`,sub:svc.length+pans.length+mk.length?"Open any result to see the full details":"",
    html:sec.length?sec.join(""):`<div class="empty anim-in"><b>Nothing found</b>Try a service, a panel or a single marker name, for example Vitamin D or ECG.</div>`};
}

/* ---------- render + transitions ---------- */
const stage=document.getElementById("stage"),stitle=document.getElementById("stitle"),shead=document.getElementById("shead"),backBtn=document.getElementById("back"),stepsEl=document.getElementById("steps");
const reduce=matchMedia("(prefers-reduced-motion: reduce)");
let route=parse(location.hash),busy=false,chosenEl=null;
function build(){
  if(Q.trim())return viewSearch();
  const r=route;
  if(r.view==="markers")return viewMarkers();
  if(r.view==="panels")return r.panel?viewPanel(r.panel):viewPanels();
  if(r.svc)return viewService(r.svc);
  if(r.sub)return viewSub(r.cat,r.sub);
  if(r.cat)return viewCategory(r.cat);
  return viewCategories();
}
function paint(dir){
  const v=build();
  stitle.innerHTML=`<h1>${esc(v.title)}</h1>${v.crumbs?`<ol class="crumbs">${v.crumbs.map(([t,h])=>`<li><a href="${h}">${esc(t)}</a></li>`).join("")}</ol>`:""}${v.sub?`<p>${esc(v.sub)}</p>`:""}`;
  stitle.classList.remove("head-anim");void stitle.offsetWidth;stitle.classList.add("head-anim");
  stage.className=dir==="back"?"dir-back":"";
  stage.innerHTML=v.html;
  const hasBack=!Q.trim()&&!!parentOf(route);
  backBtn.classList.toggle("gone",!hasBack&&!Q.trim());
  backBtn.setAttribute("aria-label",Q.trim()?"Clear search":"Go back");
  const depth=route.view==="services"?route.depth:null;
  const total=route.svc?(route.svc.sub?4:3):route.sub?4:(route.cat&&subsOf(route.cat).length?4:3);
  stepsEl.innerHTML=depth===null||Q.trim()?"":Array.from({length:Math.max(total,depth+1)},(_,k)=>`<i class="${k<depth?"on":""} ${k===depth?"cur":""}"></i>`).join("");
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.route==="#/"+(route.view==="services"?"":route.view)));
  movePill();
  countUp();
  if(HL){const h=stage.querySelector("li.hit");if(h)setTimeout(()=>h.scrollIntoView({behavior:reduce.matches?"auto":"smooth",block:"center"}),650)}
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function transition(dir){
  if(busy)return;busy=true;
  if(!reduce.matches&&stage.children.length){
    stage.classList.add("leaving");if(dir==="back")stage.classList.add("dir-back");
    shead.classList.add("leaving");
    if(chosenEl)chosenEl.classList.add("chosen");
    await wait(chosenEl?380:300);
  }
  shead.classList.remove("leaving");
  stage.classList.remove("leaving");
  chosenEl=null;
  window.scrollTo({top:0,behavior:"instant"});
  paint(dir);
  busy=false;
}
function go(h,el){chosenEl=el||null;if(location.hash===h){route=parse(h);transition("fwd")}else location.hash=h}
window.addEventListener("hashchange",()=>{
  const nr=parse(location.hash);
  const dir=nr.view!==route.view?"fwd":(nr.depth<route.depth?"back":"fwd");
  if(Q.trim()){HL=Q.trim();Q="";qEl.value="";sbox.classList.remove("has")}
  else if(nr.depth<route.depth||nr.view!==route.view)HL="";
  route=nr;transition(dir);
});

/* count-up */
function countUp(){
  if(reduce.matches)return;
  document.querySelectorAll("[data-count]").forEach(el=>{
    const end=+el.dataset.count;if(!end||end<3)return;
    const small=el.querySelector("small");const suffix=small?small.outerHTML:"";
    const t0=performance.now(),dur=Math.min(900,420+end*3);
    const step=t=>{const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);el.innerHTML=Math.round(end*e)+suffix;if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

/* tab pill */
const pill=document.querySelector(".tabs .pill");
function movePill(){const b=document.querySelector('.tabs button[aria-selected="true"]');if(!b)return;pill.style.width=b.offsetWidth+"px";pill.style.transform=`translateX(${b.offsetLeft}px)`}
window.addEventListener("resize",movePill);

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go]");
  if(t){e.preventDefault();go(t.dataset.go,t.classList.contains("tile")?t:null);return}
  const ph=e.target.closest(".panel-h");
  if(ph){const p=ph.closest(".panel");const o=p.classList.toggle("open");ph.setAttribute("aria-expanded",o);return}
  if(e.target.id==="hloff"){HL="";paint("fwd")}
});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{Q="";qEl.value="";sbox.classList.remove("has");HL="";go(b.dataset.route)}));
document.getElementById("home").onclick=()=>{Q="";qEl.value="";sbox.classList.remove("has");HL="";go("#/")};
backBtn.onclick=()=>{
  if(Q.trim()){Q="";qEl.value="";sbox.classList.remove("has");transition("back");return}
  const p=parentOf(route);if(p)go(p);
};
const qEl=document.getElementById("q"),sbox=document.getElementById("sbox");let tmr;
qEl.addEventListener("input",()=>{clearTimeout(tmr);tmr=setTimeout(()=>{const was=!!Q.trim();Q=qEl.value;sbox.classList.toggle("has",!!Q);
  if(was&&Q.trim()){busy=false;paint("fwd");return}transition(Q.trim()?"fwd":"back")},180)});
document.getElementById("clr").onclick=()=>{qEl.value="";Q="";sbox.classList.remove("has");transition("back");qEl.focus()};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus()}
  if(e.key==="Escape"){if(document.activeElement===qEl&&Q){document.getElementById("clr").click()}else if(!Q&&parentOf(route)){go(parentOf(route))}}
});
const topEl=document.getElementById("top");addEventListener("scroll",()=>topEl.classList.toggle("scrolled",scrollY>4),{passive:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
paint("fwd");
})();
</script>
</body>
</html>
